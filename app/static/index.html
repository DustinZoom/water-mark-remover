<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paraphraser</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #dddcd6; --accent: #2f5bd3; --accent-text: #fff; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993;
      --border: #34332f; --accent: #6d8ff0; --accent-text: #0e0e0d; --error: #f2857d;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .pane { display: flex; flex-direction: column; min-width: 0; }
  .pane-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: .85rem; color: var(--muted); margin-bottom: 6px;
  }
  textarea, .output {
    width: 100%; min-height: 420px; padding: 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font: inherit; resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .output { white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto; }
  .output:empty::before { content: "Rewritten text appears here."; color: var(--muted); }
  .output.streaming::after {
    content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .bar { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; padding: 10px 22px; border-radius: 8px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .spinner {
    width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .8s linear infinite; display: none;
  }
  .loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { color: var(--muted); font-size: .9rem; }
  #status.error { color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>Paraphraser</h1>
  <p class="sub">Rewrites your text with the same meaning using a small local language model.</p>

  <div class="grid">
    <div class="pane">
      <div class="pane-head"><label for="input">Original</label><span id="count">0</span></div>
      <textarea id="input" placeholder="Paste text here…"></textarea>
    </div>
    <div class="pane">
      <div class="pane-head"><span>Rewritten</span><span id="outcount"></span></div>
      <div id="output" class="output" aria-live="polite"></div>
    </div>
  </div>

  <div class="bar">
    <button id="go"><span class="spinner"></span><span id="go-label">Rewrite</span></button>
    <button id="stop" class="secondary" hidden>Stop</button>
    <button id="copy" class="secondary" disabled>Copy</button>
    <span id="status"></span>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const input = $("input"), output = $("output"), go = $("go"), stop = $("stop"),
      copy = $("copy"), status = $("status"), count = $("count");
let maxChars = 8000, controller = null;

function setStatus(msg, isError = false) {
  status.textContent = msg;
  status.classList.toggle("error", isError);
}
function updateCount() {
  const n = input.value.length;
  count.textContent = `${n.toLocaleString()} / ${maxChars.toLocaleString()}`;
  go.disabled = controller !== null || !input.value.trim() || n > maxChars;
}
function setLoading(on) {
  go.classList.toggle("loading", on);
  $("go-label").textContent = on ? "Rewriting…" : "Rewrite";
  stop.hidden = !on;
  output.classList.toggle("streaming", on);
  updateCount();
}

fetch("/api/health").then(r => r.json()).then(h => {
  if (h.max_chars) maxChars = h.max_chars;
  updateCount();
  if (!h.ok) setStatus(h.error || `Model ${h.model} is not available yet.`, true);
}).catch(() => {});

input.addEventListener("input", updateCount);
input.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !go.disabled) go.click();
});

go.addEventListener("click", async () => {
  controller = new AbortController();
  output.textContent = "";
  copy.disabled = true;
  setLoading(true);
  setStatus("Waiting for the model…");
  const started = performance.now();
  let first = true;

  try {
    const res = await fetch("/api/rewrite", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: input.value }),
      signal: controller.signal,
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      const d = body.detail;
      throw new Error(typeof d === "string" ? d : (d?.[0]?.msg || `HTTP ${res.status}`));
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      if (first) { first = false; setStatus("Generating…"); }
      output.textContent += decoder.decode(value, { stream: true });
      output.scrollTop = output.scrollHeight;
    }
    output.textContent = output.textContent.trim();
    setStatus(`Done in ${((performance.now() - started) / 1000).toFixed(1)}s`);
  } catch (err) {
    if (err.name === "AbortError") setStatus("Stopped.");
    else setStatus(err.message || "Something went wrong.", true);
  } finally {
    controller = null;
    setLoading(false);
    copy.disabled = !output.textContent;
  }
});

stop.addEventListener("click", () => controller?.abort());
copy.addEventListener("click", async () => {
  await navigator.clipboard.writeText(output.textContent);
  setStatus("Copied.");
});
updateCount();
</script>
</body>
</html>
